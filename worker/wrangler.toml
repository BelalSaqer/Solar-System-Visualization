name = "solar-system-chat"
main = "src/index.ts"
compatibility_date = "2026-01-01"

# Created via `wrangler kv namespace create RATE_LIMIT_KV` — id filled in
# after that command runs (see README in this folder).
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "e1b32b4a42b6488d9f938c2581a9e19d"

# Workers AI — runs the chat model directly on Cloudflare's free tier
# (10,000 Neurons/day at no charge, no card required). No API key needed.
[ai]
binding = "AI"
